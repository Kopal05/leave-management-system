<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Leave Management System</mat-card-title>
      <mat-card-subtitle>Sign in with your company account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="you@company.com">
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="errorMessage()">{{ errorMessage() }}</div>

        <button mat-raised-button color="primary" class="full-width login-btn" type="submit" [disabled]="loading()">
          <mat-spinner *ngIf="loading()" diameter="20" style="display:inline-block; margin-right:8px;"></mat-spinner>
          <span *ngIf="!loading()">Sign In</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
