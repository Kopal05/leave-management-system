<div class="page-container">
  <h2 class="section-title">My Leaves</h2>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="leaves()" class="full-width" *ngIf="leaves().length; else empty" multiTemplateDataRows>
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Title</th>
          <td mat-cell *matCellDef="let l">{{ l.title }}</td>
        </ng-container>
        <ng-container matColumnDef="startDate">
          <th mat-header-cell *matHeaderCellDef>Start</th>
          <td mat-cell *matCellDef="let l">{{ l.startDate }}</td>
        </ng-container>
        <ng-container matColumnDef="endDate">
          <th mat-header-cell *matHeaderCellDef>End</th>
          <td mat-cell *matCellDef="let l">{{ l.endDate }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let l">
            <span [class]="l.status === 'PLANNED' ? 'status-planned' : 'status-cancelled'">{{ l.status }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let l">
            <ng-container *ngIf="l.status === 'PLANNED'">
              <button mat-icon-button (click)="startEdit(l)" [disabled]="!l.editable"
                      [matTooltip]="l.editable ? 'Edit leave' : 'Cutoff period has passed - editing is blocked'">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="cancelLeave(l)" [disabled]="!l.editable"
                      [matTooltip]="l.editable ? 'Cancel leave' : 'Cutoff period has passed - cancelling is blocked'">
                <mat-icon>cancel</mat-icon>
              </button>
            </ng-container>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns;"></tr>
      </table>

      <ng-template #empty>
        <div class="empty-state">You have no leave records yet. Apply for one from the Apply Leave page.</div>
      </ng-template>
    </mat-card-content>
  </mat-card>

  <!-- Inline edit form -->
  <mat-card *ngIf="editingLeaveId() !== null">
    <mat-card-header>
      <mat-card-title>Edit Leave</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="saveEdit(editingLeaveId()!)">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Leave Title</mat-label>
          <input matInput formControlName="title">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Reason</mat-label>
          <textarea matInput formControlName="reason" rows="3"></textarea>
        </mat-form-field>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="startDate" [min]="minDate">
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="endDate" [min]="form.get('startDate')?.value || minDate">
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="form-actions">
          <button mat-button type="button" (click)="cancelEdit()">Cancel</button>
          <button mat-raised-button color="primary" type="submit">Save Changes</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
