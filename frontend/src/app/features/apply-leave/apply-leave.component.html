<div class="page-container">
  <h2 class="section-title">Apply for Leave</h2>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Leave Title</mat-label>
          <input matInput formControlName="title" placeholder="e.g. Family Vacation">
          <mat-error *ngIf="form.get('title')?.hasError('required')">Leave title is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Reason</mat-label>
          <textarea matInput formControlName="reason" rows="3" placeholder="Briefly describe the reason"></textarea>
          <mat-error *ngIf="form.get('reason')?.hasError('required')">Reason is required</mat-error>
        </mat-form-field>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="startDate" [min]="minDate">
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
            <mat-error *ngIf="form.get('startDate')?.hasError('required')">Start date is required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="endDate" [min]="form.get('startDate')?.value || minDate">
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
            <mat-error *ngIf="form.get('endDate')?.hasError('required')">End date is required</mat-error>
          </mat-form-field>
        </div>

        <p class="hint">Leave can be a single day (choose the same start and end date) or span multiple days.</p>

        <button mat-raised-button color="primary" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Submitting...' : 'Submit Leave Request' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
