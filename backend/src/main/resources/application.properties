server.port=8080

spring.application.name=leave-management-system

# ---------------- Database ----------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leave_management_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------- JWT ----------------
# Provide JWT_SECRET through an environment variable
jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds
jwt.expiration-ms=86400000

# ---------------- Leave Configuration ----------------
# Number of days before a leave's start date after which edit/cancel is blocked
leave.edit-cutoff-days=5

# ---------------- Default Admin ----------------
# Default admin is created at startup if no users exist
app.default-admin.name=System Admin
app.default-admin.email=${ADMIN_EMAIL:admin@lms.com}
app.default-admin.password=${ADMIN_PASSWORD}